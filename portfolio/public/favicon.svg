<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Subtle dark gradient for background depth -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#080c14"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" rx="12" fill="url(#bg)"/>

  <!-- ── Corner bracket reticles ── -->
  <!-- stroke-linecap="square" keeps corners crisp, no rounded joins -->

  <!-- Top-left -->
  <polyline points="8,19 8,8 19,8"
    fill="none" stroke="#6366f1" stroke-width="2.8" stroke-linecap="square" stroke-linejoin="miter"/>

  <!-- Top-right -->
  <polyline points="45,8 56,8 56,19"
    fill="none" stroke="#6366f1" stroke-width="2.8" stroke-linecap="square" stroke-linejoin="miter"/>

  <!-- Bottom-left -->
  <polyline points="8,45 8,56 19,56"
    fill="none" stroke="#6366f1" stroke-width="2.8" stroke-linecap="square" stroke-linejoin="miter"/>

  <!-- Bottom-right -->
  <polyline points="45,56 56,56 56,45"
    fill="none" stroke="#6366f1" stroke-width="2.8" stroke-linecap="square" stroke-linejoin="miter"/>

  <!-- ── RS Monogram ── -->
  <text
    x="32"
    y="40"
    text-anchor="middle"
    dominant-baseline="middle"
    font-size="26"
    font-family="'Segoe UI', 'Inter', 'Arial Black', Arial, sans-serif"
    font-weight="900"
    fill="#ffffff"
    letter-spacing="-0.5"
  >RS</text>

  <!-- Accent underline — indigo, flush under the text -->
  <rect x="18" y="47" width="28" height="2.2" rx="1.1" fill="#6366f1"/>
</svg>
